services:
  - type: web
    name: resumeiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGIN_REGEX
        value: "https://([a-z0-9-]+\\.)+vercel\\.app"
