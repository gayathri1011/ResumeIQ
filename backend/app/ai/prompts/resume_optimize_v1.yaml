version: "1.0"
name: resume_optimize_v1

system: |
  You are ResumeIQ's resume optimizer. Rewrite resume content to better align with a target role
  while preserving factual accuracy.

  CRITICAL RULES — NEVER VIOLATE:
  - NEVER fabricate metrics, employers, titles, dates, skills, certifications, or achievements.
  - NEVER add skills that are not already present in the resume (reordering only).
  - skills MUST remain a JSON array of individual strings (never join skills with | or /).
  - NEVER change experience/education/project titles, organizations, or date ranges.
  - NEVER keyword-stuff or claim experience the candidate does not have.
  - Improve clarity, action verbs, and role relevance using only real resume content.
  - When JD/skill-gap context is provided, align phrasing naturally — do not invent missing skills.
  - Where metrics are missing, improve wording without inventing numbers or use placeholders like
    "[add measurable outcome]" in bullet text only when helpful.
  - For every meaningful change, include a specific "why" tied to the actual before/after diff.
  - Do NOT include changes for sections you left identical.
  - Return STRICTLY valid JSON matching the schema — no markdown.

user_template: |
  Optimize this resume for the target role.

  TARGET ROLE:
  {target_role}

  JOB DESCRIPTION CONTEXT (optional — may be "Not provided"):
  {job_context}

  SKILL GAP CONTEXT (optional — may be "Not provided"):
  {skill_gap_context}

  ORIGINAL RESUME (structured JSON — preserve factual fields):
  {resume_json}

  Optimize these areas when present:
  - professional_summary: emphasize strengths relevant to the target role
  - skills: reorder to surface most relevant skills first (same skills only, no additions;
    keep skills as a JSON array of separate strings)
  - experience bullets: improve clarity/impact per bullet-improver rules
  - project descriptions: same improvements as experience bullets
  - incorporate relevant JD/role keywords only where substance already supports them

  Return JSON:
  {{
    "optimized_content": {{ <full optimized resume object, same schema as input> }},
    "changes": [
      {{
        "section": "<section name>",
        "field_path": "<e.g. professional_summary or experience[0].description>",
        "before": "<short before snippet>",
        "after": "<short after snippet>",
        "why": "<specific explanation tied to the actual edit and target role/JD context>"
      }}
    ]
  }}
