[project]
name = "resumeiq-backend"
version = "0.1.0"
description = "ResumeIQ FastAPI backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "beanie==1.26.0",
    "motor>=3.7.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "pillow>=10.0.0",
    # RapidOCR 1.4.x supports Python <3.13 (Render must use 3.12 via runtime.txt)
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime>=1.16.0,<1.21.0",
    "aiofiles>=24.1.0",
    "openai>=1.58.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
